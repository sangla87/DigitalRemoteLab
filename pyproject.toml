[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalremotelab"
version = "0.1.0"
description = "Laboratorio remoto de FPGAs (Zybo Z7-10) para prácticas de electrónica digital"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
camera = ["opencv-python-headless>=4.8"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
drl = "digitalremotelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
